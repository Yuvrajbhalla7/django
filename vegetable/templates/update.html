{%extends "base.html"%}
{%block start%}
<div class="container mt-5">

    <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
      {% csrf_token %}
  <div class="mb-3">
    <h2>update Recipe</h2>
    <hr>
    <label for="exampleInputEmail1" class="form-label">recipe name</label>
    <input name="recipe_name" value={{recipe.recipe_name}} type="text" class="form-control" >
    </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">recipe discription</label>
   <textarea name="recipe_description" class="form-control">{{recipe.recipe_description}}</textarea>
   </div>
    <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">recipe image</label>
    <input name="image"  type="file" class="form-control" >
   </div>
  
 
   <button type="submit" class="btn btn-success">update</button>

</form>  


</div>

{% endblock%}
