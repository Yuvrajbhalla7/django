{%extends "base.html"%}
{%block start%}
<div class="container mt-5">

    <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
      {% csrf_token %}
  <div class="mb-3">
    <h2>register</h2>
    <hr>
    {% if messages %}
    <div class="alert alert-primary" role="alert">
        {% for message in messages %}
  
       {{message}}
        {% endfor %}
    </div>
    
<ul class="messages">
    
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}></li>
    
</ul>
{% endif %}
    <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label"> First name</label>
    <input type="text" class="form-control" name="firstname" id="exampleInputEmail1" aria-describedby="emailHelp">
    
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label"> Last name</label>
    <input type="text" class="form-control" name="lastname" id="exampleInputEmail1" aria-describedby="emailHelp">
   
    
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label"> Username</label>
    <input type="text" class="form-control" name="username" id="exampleInputEmail1" aria-describedby="emailHelp">
   
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" name="password" id="exampleInputPassword1">
     <p>already have an account. <a href="/login/">login</a> </p>

  <button type="submit" class="btn btn-primary">Submit</button>

  

</div>

{% endblock%}
