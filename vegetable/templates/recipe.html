{%extends "base.html"%}
{%block start%}
<div class="container mt-5">

    <form class="col-6 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
      {% csrf_token %}
  <div class="mb-3">
    <h2>Add Recipe</h2>
    <hr>
    <label for="exampleInputEmail1" class="form-label">recipe name</label>
    <input name="recipe_name" type="text" class="form-control" >
    </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">recipe discription</label>
   <textarea name="recipe_description" class="form-control"></textarea>
   </div>
    <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">recipe image</label>
    <input name="image"  type="file" class="form-control" >
   </div>
  
  <button type="submit" class="btn btn-success">Add Recipe</button>
</form>  
  {{recipes}}  
  <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Recipe name</th>
      <th scope="col">Recipe description </th>
      <th scope="col">Image</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody>
    {%for recipe in recipes%}
    <tr>
      <th scope="row">{{forloop.counter}}</forloop></th>
      <td>{{recipe.recipe_name}}</td>
      <td>{{recipe.recipe_description}}</td>
      <td>
        <img src="/media/{{recipe.image}}" style="height: 100px"></td>
      <td>
     
        <a href="/delete-recipe/{{recipe.id}}/" class= "btn btn-danger m-2">delete</a>
        <a href="/update-recipe/{{recipe.id}}/" class= "btn btn-success">update</a>

      </td>
    </tr>
    {%endfor%}
  </tbody>
</table>
</div>

{% endblock%}
